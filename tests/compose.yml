services:
 postgres:
  volumes: !override []
  tmpfs: [/var/lib/postgresql/data]
  restart: "no"
 api:
  restart: "no"
 site:
  restart: "no"
 repository-checker:
  command: [python, /app/tests/github-fixture.py]
  volumes:
   - ./tests:/app/tests:ro
   - ./backend/seed.json:/app/backend/seed.json:ro
  restart: "no"
