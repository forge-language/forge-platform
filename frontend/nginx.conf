map_hash_bucket_size 256;
include /etc/nginx/forge/release-artifacts.conf;
limit_req_zone $binary_remote_addr zone=forge_public:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=forge_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=forge_publish:1m rate=__FORGE_WRITE_RATE__;
limit_conn_zone $binary_remote_addr zone=forge_connections:10m;
map $request_method $forge_write_key { default ""; POST $binary_remote_addr; }
limit_req_zone $forge_write_key zone=forge_writes:1m rate=__FORGE_WRITE_RATE__;
server {
 listen 80;
 server_tokens off;
 limit_req_status 429;
 limit_conn_status 429;
 limit_req zone=forge_public burst=120 nodelay;
 limit_conn forge_connections 40;
 client_header_timeout 10s;
 client_body_timeout 30s;
 send_timeout 30s;
 client_max_body_size 2m;
 server_name _;
 root /usr/share/nginx/html;
 gzip on;
 gzip_vary on;
 gzip_min_length 512;
 gzip_comp_level 5;
 gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
 etag on;
 if ($host = www.forge-lang.org) { return 308 https://forge-lang.org$request_uri; }
 if ($http_x_forwarded_proto = http) { return 308 https://forge-lang.org$request_uri; }
 # Only the loopback-bound host/tunnel gateway may supply Cloudflare client IPs.
 set_real_ip_from 172.28.241.1;
 real_ip_header CF-Connecting-IP;
 include /etc/nginx/forge/security-headers.conf;
 location ~ (^|/)\. { return 404; }
 location /api/auth/ { limit_req zone=forge_login burst=5 nodelay; proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; add_header Cache-Control "no-store" always; include /etc/nginx/forge/security-headers.conf; }
 location = /api/packages { limit_req zone=forge_public burst=120 nodelay; limit_req zone=forge_writes burst=__FORGE_WRITE_BURST__ nodelay; proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
 location ~ ^/api/packages/(inspect|register)$ { limit_req zone=forge_writes burst=__FORGE_WRITE_BURST__ nodelay; proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 2m; }
 location = /github/callback { limit_req zone=forge_login burst=5 nodelay; proxy_pass http://api:8080/api/auth/github/callback; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
 location = /install.sh { default_type text/plain; add_header Cache-Control no-store; include /etc/nginx/forge/security-headers.conf; }
 location /releases/ { if ($forge_release_url != "") { return 302 $forge_release_url; } alias /srv/releases/; default_type application/octet-stream; autoindex off; }
 location /assets/ { add_header Cache-Control "public,max-age=31536000,immutable"; include /etc/nginx/forge/security-headers.conf; try_files $uri =404; }
 location = /live/manifest.json {
  alias /srv/activity/current/manifest.json;
  default_type application/json;
  add_header Cache-Control no-store;
  include /etc/nginx/forge/security-headers.conf;
 }
 location = /live/benchmarks/latest.json {
  alias /srv/activity/current/benchmarks/latest.json;
  default_type application/json;
  add_header Cache-Control no-store;
  include /etc/nginx/forge/security-headers.conf;
 }
 location = /live/refresh-status.json {
  alias /srv/activity/refresh-status.json;
  default_type application/json;
  add_header Cache-Control no-store;
  include /etc/nginx/forge/security-headers.conf;
 }
 location /live/snapshots/ {
  alias /srv/activity/snapshots/;
  autoindex off;
  types { application/json json; text/plain md; }
  default_type text/plain;
  add_header Cache-Control "public,max-age=86400,immutable";
  include /etc/nginx/forge/security-base.conf;
  add_header Content-Security-Policy "default-src 'none'; sandbox" always;
 }
 location /live/ { return 404; }
 location = /activity.json {
  root /srv/activity;
  default_type application/json;
  add_header Cache-Control no-store;
  include /etc/nginx/forge/security-headers.conf;
  try_files $uri @activity_unavailable;
 }
 location @activity_unavailable {
  root /usr/share/nginx/html;
  default_type application/json;
  add_header Cache-Control no-store;
  include /etc/nginx/forge/security-headers.conf;
  try_files /activity.json =404;
 }
 location = /benchmarks.json { root /srv/activity; default_type application/json; add_header Cache-Control "no-cache"; include /etc/nginx/forge/security-headers.conf; try_files $uri =404; }
 location /materials/ { root /srv/activity; default_type text/plain; add_header Cache-Control "no-cache"; include /etc/nginx/forge/security-headers.conf; try_files $uri =404; }
 location = /playground/runner.html {
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' blob:; worker-src blob:; connect-src 'none'; frame-ancestors 'self'; sandbox allow-scripts" always;
  include /etc/nginx/forge/security-base.conf;
  try_files $uri =404;
 }
 location /playground/ {
  add_header Cache-Control "public,max-age=3600,must-revalidate";
  include /etc/nginx/forge/security-headers.conf;
  types { application/javascript js mjs; application/wasm wasm; }
  try_files $uri =404;
 }
 location /reports/ { try_files $uri =404; }
 location /project/ { try_files $uri =404; }
 location = /releases/latest.json { alias /srv/releases/latest.json; default_type application/json; }
 location = / {
  if ($host = play.forge-lang.org) { return 308 https://forge-lang.org/play; }
  if ($host = packages.forge-lang.org) { return 308 https://forge-lang.org/packages; }
  try_files $uri /index.html;
 }
 location / { add_header Cache-Control "no-cache"; include /etc/nginx/forge/security-headers.conf; try_files $uri /index.html; }
}
