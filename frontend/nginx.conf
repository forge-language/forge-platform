server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' https://avatars.githubusercontent.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 2m; }
 location = /install.sh { default_type text/plain; add_header Cache-Control no-store; }
 location /releases/ { alias /srv/releases/; default_type application/octet-stream; autoindex off; }
 location /assets/ { add_header Cache-Control "public,max-age=31536000,immutable"; try_files $uri =404; }
 location / { try_files $uri /index.html; }
}
